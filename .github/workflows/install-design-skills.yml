name: Install project UI design skills

on:
  push:
    branches:
      - design/unified-research-ui
    paths:
      - .github/workflows/install-design-skills.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: design/unified-research-ui
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install requested skills into the project
        run: |
          npx --yes skills add nextlevelbuilder/ui-ux-pro-max-skill --skill ui-ux-pro-max --copy --yes
          npx --yes skills add anthropics/skills --skill frontend-design --copy --yes
          npx --yes skills add Leonxlnx/taste-skill --copy --yes
          npx --yes skills add wshobson/agents --skill design-system-patterns --copy --yes
          npx --yes skills add vercel-labs/agent-skills --skill web-design-guidelines --copy --yes
          npx --yes skills add wshobson/agents --skill responsive-design --copy --yes

      - name: Commit installed skills
        run: |
          rm -f .github/workflows/install-design-skills.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents .claude .codex .cursor .opencode 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No skill changes to commit."
          else
            git commit -m "Install UI design and responsive design agent skills"
            git push origin design/unified-research-ui
          fi
